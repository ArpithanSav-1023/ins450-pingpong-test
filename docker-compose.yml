# Host networking so the containers reach the exporters on 127.0.0.1:9101/9103.
# Both UIs are bound to localhost only; expose Grafana to your phone with `tailscale serve` (see docs/HOW_TO_RUN.md).
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d", "--web.listen-address=127.0.0.1:9090"]
  grafana:
    image: grafana/grafana:11.3.1
    network_mode: host
    restart: unless-stopped
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # read-only viewing without login
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pingpong450.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - graf_data:/var/lib/grafana
    depends_on:
      - prometheus
  loki:
    image: grafana/loki:3.2.1
    network_mode: host
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./config/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
  promtail:
    image: grafana/promtail:3.2.1
    network_mode: host
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./config/loki/promtail.yml:/etc/promtail/promtail.yml:ro
      - ./runs:/runs:ro
      - promtail_pos:/positions
    depends_on:
      - loki
volumes:
  loki_data:
  promtail_pos:
  prom_data:
  graf_data:
