# Ships the live message feed (runs/*/feed_A.log, feed_B.log written by traffic/pp.py) to Loki.
server:
  http_listen_address: 127.0.0.1
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /positions/positions.yaml
clients:
  - url: http://127.0.0.1:3100/loki/api/v1/push
scrape_configs:
  - job_name: pingpong
    static_configs:
      - targets: [localhost]
        labels:
          job: pingpong
          __path__: /runs/*/feed_*.log
    pipeline_stages:
      - regex:
          expression: '^(?P<role>[AB]) (?P<kind>[A-Z]+)\s'
      - labels:
          role:
          kind:
